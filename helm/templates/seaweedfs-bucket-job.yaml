{{- if .Values.localS3.enabled }}
{{- /*
Creates global.s3.bucket on the local SeaweedFS. Idempotent: it only creates the
bucket when head-bucket says it does not exist, and retries until the S3 gateway is up.
Runs as a helm hook so it is re-run on every install/upgrade.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-seaweedfs-bucket
  namespace: {{ .Release.Namespace }}
  labels:
    app: seaweedfs-bucket
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: seaweedfs-bucket
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: create-bucket
          image: "{{ .Values.localS3.bucketJob.image.repository }}:{{ .Values.localS3.bucketJob.image.tag }}"
          imagePullPolicy: {{ .Values.localS3.bucketJob.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              for i in $(seq 1 60); do
                if aws --endpoint-url "$S3_ENDPOINT" s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
                  echo "bucket $S3_BUCKET exists"; exit 0
                fi
                if aws --endpoint-url "$S3_ENDPOINT" s3api create-bucket --bucket "$S3_BUCKET"; then
                  echo "bucket $S3_BUCKET created"; exit 0
                fi
                echo "S3 not ready yet (attempt $i), retrying"; sleep 5
              done
              echo "could not create bucket $S3_BUCKET" >&2; exit 1
          env:
            - name: HOME
              value: /tmp
            - name: S3_ENDPOINT
              value: {{ .Values.global.s3.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.global.s3.bucket | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.global.s3.region | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "ogdc.s3CredentialsSecret" . | quote }}
                  key: accessKeyId
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ogdc.s3CredentialsSecret" . | quote }}
                  key: secretAccessKey
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
{{- end }}
