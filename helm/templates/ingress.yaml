{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-ogdc-rewrite@kubernetescrd" .Release.Namespace | quote }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName | quote }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  - host: {{ .Values.ogdc_public_host | quote }}
    http:
      paths:
      - path: {{ .Values.ingress.apiPath | quote }}
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-service
            port:
              number: 8000
      # Signed download links (`/storage/<key>?expires=..&signature=..`) are verified
      # and streamed from S3 by ogdc-service itself, so /storage targets the same
      # service as the API. The prefix is NOT stripped (see middleware.yaml).
      - path: {{ .Values.ingress.storagePath | quote }}
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-service
            port:
              number: 8000
{{- end }}
