## override values.yaml with values to use for running on the NCEAS prod cluster
##
## example:
##
##  export RELEASE_NAME=qgnet-ogdc NAMESPACE=qgnet
##  envsubst < ./helm/examples/values-prod-cluster-ogdc-example.yaml | \
##  helm upgrade --install "$RELEASE_NAME" --debug -n "$NAMESPACE" \
##      -f - oci://ghcr.io/qgreenland-net/charts/ogdc --version [version]
##
## (or to install from local helm chart code, replace:
##  oci://ghcr.io/qgreenland-net/charts/ogdc with: ./helm)
##
## see values.yaml for full documentation on the following parameters
##


global:
  ## S3 object storage. Credentials come from the Secret `${RELEASE_NAME}-s3-credentials`
  ## (keys accessKeyId, secretAccessKey, storageLinkSigningKey), deployed from `../admin/secrets.yaml`.
  s3:
    endpoint: "https://s3.dataone.org"
    region: "default"
    bucket: "ogdc-prod"
    forcePathStyle: true

## argo-workflows configuration
## See https://argoproj.github.io/argo-workflows/
argo-workflows:

  ## Custom resource configuration
  crds:
    ## -- Install and upgrade CRDs
    install: false

  controller:
    workflowNamespaces:
      - ${NAMESPACE}

    persistence:
      postgresql:
        host: "${RELEASE_NAME}-db-cnpg-rw"
        database: "ogdc"
        tableName: "argo_workflows_archive"
        userNameSecret:
          name: "${RELEASE_NAME}-db-postgres-secrets"
          key: "username"
        passwordSecret:
          name: "${RELEASE_NAME}-db-postgres-secrets"
          key: "password"

  ## Argo Server configuration
  server:
    ## -- Value for base href in index.html. Used if the server is running behind reverse proxy under subpath different from /.
    ## only updates base url of resources on client side,
    ## it's expected that a proxy server rewrites the request URL and gets rid of this prefix
    ## https://github.com/argoproj/argo-workflows/issues/716#issuecomment-433213190
    baseHref: /

    ## Ingress configuration.
    # ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
    ingress:
      ## -- Enable an ingress resource
      ## Enable an ingress resource for the Argo server
      enabled: true
      # -- Ingress class name
      ## Your cluster may require this to be set to match your IngressClass resource.
      ingressClassName: "traefik"
      annotations: {
        cert-manager.io/cluster-issuer: letsencrypt-prod,
      }
      ## -- Ingress hosts
      ## Add host names (without http(s):// or path) that map to the argo server service.
      ## You may need to add multiple hosts if you have multiple DNS names that map to the
      ## same service.
      hosts:
        - ogdc.dataone.org
      ## -- Ingress service backend configuration
      ## This is the port for the ogdc service
      servicePort: 8000
      ## -- Ingress TLS configuration
      tls:
        - hosts:
            - ogdc.dataone.org
          secretName: ogdc-tls-cert

image:
  repository: "ghcr.io/qgreenland-net/ogdc-runner"
  tag: latest

environment: "prod"

auth:
  accessMode: "authenticated"
  oidcSecretName: "${RELEASE_NAME}-oidc-config"

ogdc_public_host: "ogdc.dataone.org"
ogdc_public_s3_url: "https://ogdc.dataone.org/storage"
dataone_node_url: "https://arcticdata.io/metacat/d1/mn"
ogdc_workflow_pvc_name: "cephfs-${RELEASE_NAME}-workflow-pvc"
ogdc_viz_workflow_image: "ghcr.io/permafrostdiscoverygateway/pdgworkflow:latest"

ingress:
  enabled: true
  tls:
    - hosts:
        - ogdc.dataone.org
      secretName: ogdc-tls-cert
