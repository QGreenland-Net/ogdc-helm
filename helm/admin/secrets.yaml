######################################################################################
#     D O   N O T   C H E C K   C R E D E N T I A L S   I N T O   G I T H U B ! ! !
######################################################################################
#
# Edit this file to add your passwords, then install them in your cluster by one of the
# following methods. Assuming your release name is "my-release": (NOTE THE RELEASE NAME MUST
# MATCH THE ONE YOU USE WITH HELM!)
#
# 1. Define the release name on the command line:
#     $  RELEASE_NAME=my-release  envsubst < secrets.yaml | kubectl apply -n <mynamespace> -f -
#
#     # if this results in "command not found: envsubst", you can install envsubst (e.g. on Mac OS:
#        $  brew install gettext && brew link --force gettext
#
# 2. Alternatively, you can simply replace "${RELEASE_NAME}" in the file below (be sure to retain
#    the "-secrets" part), and do:     $  kubectl apply -n <mynamespace> -f secrets.yaml)
#
apiVersion: v1
kind: Secret
metadata:
  #######################################################################
  ##  IMPORTANT:
  ##  EDIT THIS TO SUBSTITUTE YOUR RELEASE NAME
  #######################################################################
  name: ${RELEASE_NAME}-api-secrets

type: Opaque

## @param stringData write-only, non-binary secret data (eg credentials) in string form.
## stringData allows specifying write-only, non-binary secret data (eg credentials) in
## string form. The stringData field is never output when reading from the API.
##
## # # #    NEVER CHECK SECRETS INTO GITHUB!   # # #
##
stringData:
  # to get a string like this run:
  # openssl rand -hex 32
  OGDC_SECRET_KEY: "<run: openssl rand -hex 32>"

## @param data
## Contains the secret data. The serialized form of the secret data is a base64 encoded string,
## representing the arbitrary (typically non-string) data value below.
data: {}

---

######################################################################################
#     D O   N O T   C H E C K   C R E D E N T I A L S   I N T O   G I T H U B ! ! !
######################################################################################
#
# S3 credentials for the object store configured in `global.s3` (see values.yaml).
# The chart only references this Secret by name; it is created outside helm, using the
# same methods described at the top of this file. The name must be
# `<release-name>-s3-credentials`, unless `global.s3.credentialsSecret` is set.
#
# The keys are consumed by the Argo artifact repository (accessKeySecret/secretKeySecret),
# the local SeaweedFS (localS3 only), and the ogdc-service pod (S3_SECRET_KEY_ID /
# S3_SECRET_KEY_KEY / OGDC_STORAGE_LINK_SIGNING_KEY). All three keys are required.
# For dev/prod, accessKeyId/secretAccessKey are issued by the object store admin and
# need read, write, list and delete access to `global.s3.bucket`.
#
apiVersion: v1
kind: Secret
metadata:
  #######################################################################
  ##  IMPORTANT:
  ##  EDIT THIS TO SUBSTITUTE YOUR RELEASE NAME
  #######################################################################
  name: ${RELEASE_NAME}-s3-credentials

type: Opaque

## @param stringData write-only, non-binary secret data (eg credentials) in string form.
##
## # # #    NEVER CHECK SECRETS INTO GITHUB!   # # #
##
stringData:
  ## @param accessKeyId S3 access key ID (issued by the object store admin)
  ## Default: your-value-here
  accessKeyId: your-value-here

  ## @param secretAccessKey S3 secret access key (issued by the object store admin)
  ## Default: your-value-here
  secretAccessKey: your-value-here

  ## @param storageLinkSigningKey HMAC key that signs the public /storage download links
  ## generate: openssl rand -hex 32 (the runner refuses keys shorter than 32 characters)
  ## Default: your-value-here
  storageLinkSigningKey: your-value-here

## @param data
## Contains the secret data. The serialized form of the secret data is a base64 encoded string,
## representing the arbitrary (typically non-string) data value below.
data: {}
