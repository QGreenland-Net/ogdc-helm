######################################################################################
#     D O   N O T   C H E C K   C R E D E N T I A L S   I N T O   G I T H U B ! ! !
######################################################################################
#
# S3 credentials for the external object store (dev/prod: NCEAS Ceph RGW; local:
# SeaweedFS). This Secret is created outside the chart, separately from the
# helm install/upgrade cycle. The chart only references it by name.
#
# Assuming your release name is "my-release" (NOTE THE RELEASE NAME MUST MATCH
# THE ONE YOU USE WITH HELM!):
#
# 1. Define the release name on the command line:
#     $  RELEASE_NAME=my-release  envsubst < s3-credentials-secret.yaml | kubectl apply -n <mynamespace> -f -
#
# 2. Alternatively, replace "${RELEASE_NAME}" in the file below (keep the
#    "-s3-credentials" part) and run: $  kubectl apply -n <mynamespace> -f s3-credentials-secret.yaml
#
# Access keys: alphanumeric only (no quotes or backslashes). The local SeaweedFS
# S3 identity config is generated from these values.
#
apiVersion: v1
kind: Secret
metadata:
  #######################################################################
  ##  IMPORTANT:
  ##  EDIT THIS TO SUBSTITUTE YOUR RELEASE NAME
  #######################################################################
  name: ${RELEASE_NAME}-s3-credentials

type: Opaque

## stringData is write-only; the values are never output when reading from the API.
##
## # # #    NEVER CHECK SECRETS INTO GITHUB!   # # #
##
stringData:
  ## @param accessKeyId S3 access key ID (TEMP/TBD: issued by the object store admin)
  accessKeyId: "your-value-here"

  ## @param secretAccessKey S3 secret access key (TEMP/TBD: issued by the object store admin)
  secretAccessKey: "your-value-here"

  ## @param storageLinkSigningKey HMAC key that signs /storage download links.
  ## Generate with: openssl rand -hex 32
  storageLinkSigningKey: "your-value-here"

## @param data
## Contains the secret data. The serialized form of the secret data is a base64 encoded string,
## representing the arbitrary (typically non-string) data value below.
data: {}
